function expJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='wadi-marikh-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function impJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.apts||!d.pays)throw 0;S=d;save();toast(t('saved'));render()}catch(e){toast('Invalid file','#DC2626')}};r.readAsText(f)}
function logp(){return `<h2>${t('log')}</h2><div class="tw"><table>${S.logs.map(l=>`<tr><td>${l.at.replace('T',' ').slice(0,16)}</td><td>${esc(l.a)}</td><td>${esc(l.d)}</td></tr>`).join('')||`<tr><td>${t('none')}</td></tr>`}</table></div>`}
function bin(){const L=[...S.pays.filter(x=>x.del).map(x=>['pays',x,`💰 ${x.apt} · ${num(x.amount)} · ${x.date}`]),...S.exps.filter(x=>x.del).map(x=>['exps',x,`🧾 ${x.name} · ${num(x.amount)}`]),...S.maint.filter(x=>x.del).map(x=>['maint',x,`🔧 ${x.title}`])];
 return `<h2>${t('bin')}</h2>`+(L.map(([k,x,l])=>`<div class="card bar">${esc(l)}<span style="flex:1"></span><button class="btn s" onclick="rest('${k}',${x.id})">${t('restore')}</button><button class="btn s r" onclick="purge('${k}',${x.id})">${t('del')}</button></div>`).join('')||`<p>${t('none')}</p>`)}
function rest(k,id){delete S[k].find(x=>x.id==id).del;log('restore-'+k,id);save();toast(t('restored'));render()}
function purge(k,id){if(!confirm(t('del')+'?'))return;S[k]=S[k].filter(x=>x.id!=id);log('purge-'+k,id);save();render()}
function about(){return `<h2>${t('about')}</h2><div class="card"><h3>${t('app')}</h3><p>${t('dev')}<br>📞 <a href="tel:${DEV.tel}">${DEV.tel}</a> · <a href="https://wa.me/966${DEV.tel.slice(1)}" target="_blank">WhatsApp</a></p><p class="mut">${t('lim')}</p></div>`}
render();
</script></body></html>
